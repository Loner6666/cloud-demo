spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations: # 全局路由跨域配置
          '[/**]': # 全局路由，所有路由都生效
            allowedOriginPatterns: "*" # 允许所有域名访问
            allowedHeaders: "*" # 允许所有请求头
            allowedMethods: "*" # 允许所有请求方法
      default-filters: # 默认过滤器，对所有路由生效
        - AddResponseHeader=X-Response-Abc, 123
      routes: # 路由配置
        - id: bing-route # 路由的ID
          uri: https://cn.bing.com/ # 目标服务地址，lb是LoadBalancer的缩写代表负载均衡
          predicates: # 断言，符合条件则路由到目标服务，如：http://localhost/search?q=haha
            - name: Path # 断言类型，这里是路径匹配
              args: # 参数
                patterns: /search # 断言参数，符合路径则路由到目标服务
            - name: Query # 断言类型，这里是查询参数匹配
              args: # 参数
                param: q # 查询参数名
                regexp: haha # 正则表达式，符合查询参数则路由到目标服务
#            - Vip=user,guofeng # 自定义断言工厂 VipRoutePredicateFactory ，这里是VIP断言，符合VIP则路由到目标服务，短写法
            - name: Vip
              args:
                param: user
                value: guofeng # 长写法 ，请求路径：http://localhost/search?q=haha&user=guofeng
          order: 10 # 路由的优先级，数字越小优先级越高
        - id: order-route
          uri: lb://service-order
          predicates:
            - name: Path
              args:
                patterns: /api/order/**
                matchTrailingSlash: true # 默认true，代表path结尾带不带/都一样，如“/api”和“/api/”，false代表这两路径不一样
          filters: # 过滤器，对请求和响应进行过滤处理
            - RewritePath=/api/order/?(?<segment>.*),/$\{segment} # 重写路径，将请求路径中的“/api/order/”替换为“/”
            - OnceToken=X-Response-Token, jwt # 自定义过滤器OnceTokenGatewayFilterFactory，添加一个一次性令牌，支持 uuid，jwt等各种格式
          order: 1
        - id: product-route
          uri: lb://service-product
          predicates:
            - Path=/api/product/** # 断言，路径匹配，符合则路由到目标服务
          filters: # 过滤器，对请求和响应进行过滤处理
            - RewritePath=/api/product/?(?<segment>.*),/$\{segment}
          order: 2

