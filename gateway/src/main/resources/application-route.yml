spring:
  cloud:
    gateway:
      routes: # 路由配置
        - id: bing-route # 路由的ID
          uri: https://cn.bing.com/ # 目标服务地址，lb是LoadBalancer的缩写代表负载均衡
          predicates: # 断言，符合条件则路由到目标服务，如：http://localhost/search?q=haha
            - name: Path # 断言类型，这里是路径匹配
              args: # 参数
                patterns: /search # 断言参数，符合路径则路由到目标服务
            - name: Query # 断言类型，这里是查询参数匹配
              args: # 参数
                param: q # 查询参数名
                regexp: haha # 正则表达式，符合查询参数则路由到目标服务
          order: 10 # 路由的优先级，数字越小优先级越高
        - id: order-route
          uri: lb://service-order
          predicates:
            - name: Path
              args:
                patterns: /api/order/**
                matchTrailingSlash: true # 默认true，代表path结尾带不带/都一样，如“/api”和“/api/”，false代表这两路径不一样
          order: 1
        - id: product-route
          uri: lb://service-product
          predicates:
            - Path=/api/product/** # 断言，路径匹配，符合则路由到目标服务
          order: 2

