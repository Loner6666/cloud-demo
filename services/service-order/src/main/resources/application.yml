server:
  port: 8000
spring:
  profiles:
    active: test
    include: feign # 包含 application-feign.yml 配置文件
  application:
    name: service-order
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        import-check:
          enabled: false
        namespace: ${spring.profiles.active:public}
# OpenFeign日志级别
logging:
  level:
    com.example.order.feign: debug


---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:common.properties?group=order
      - nacos:database.properties?group=order
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:common.properties?group=order
      - nacos:database.properties?group=order
      - nacos:haha.properties?group=order
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:common.properties?group=order
      - nacos:database.properties?group=order
      - nacos:hehe.properties?group=order


